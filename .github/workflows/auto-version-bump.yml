name: Auto Version Bump

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump workspace version
    runs-on: ubuntu-latest
    if: startsWith(github.event.head_commit.message, 'build(deps):')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: legra-ai/github-actions/.github/actions/setup-cocogitto@main

      - name: Create version bump
        run: |
          cog bump --patch --skip-ci
          NEW_VERSION=$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)
          if [ -z "$NEW_VERSION" ]; then
            echo "Could not read the bumped workspace version" >&2
            exit 1
          fi
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          if git rev-parse "$NEW_VERSION" >/dev/null 2>&1; then
            # Cocogitto creates this local tag; CI creates the release tag after validation.
            git tag -d "$NEW_VERSION"
          fi

      - name: Push verified version commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_OID: ${{ github.sha }}
        run: |
          HEADLINE=$(git log -1 --pretty=%s HEAD)
          BODY=$(git log -1 --pretty=%b HEAD)
          export HEADLINE BODY

          python3 <<'PY' > /tmp/payload.json
          import base64
          import json
          import os
          import pathlib

          def encoded(path):
              return base64.b64encode(pathlib.Path(path).read_bytes()).decode()

          message = {"headline": os.environ["HEADLINE"]}
          body = os.environ.get("BODY", "").strip()
          if body:
              message["body"] = body

          payload = {
              "query": "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              "variables": {
                  "input": {
                      "branch": {
                          "repositoryNameWithOwner": os.environ["REPOSITORY"],
                          "branchName": "main",
                      },
                      "message": message,
                      "fileChanges": {
                          "additions": [
                              {"path": "Cargo.toml", "contents": encoded("Cargo.toml")},
                          ]
                      },
                      "expectedHeadOid": os.environ["EXPECTED_OID"],
                  }
              },
          }
          print(json.dumps(payload))
          PY

          if ! gh api graphql --input /tmp/payload.json > /tmp/result.json; then
            echo "GraphQL version commit failed" >&2
            exit 1
          fi
          if jq -e '.errors | length > 0' /tmp/result.json >/dev/null; then
            cat /tmp/result.json >&2
            exit 1
          fi
          jq -e '.data.createCommitOnBranch.commit.oid' /tmp/result.json
