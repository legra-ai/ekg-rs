name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Check code formatting
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

  # Run clippy linting with the default, redistributable feature set. The
  # all-features graph enables the proprietary RDFox backend, whose SDK is not
  # available to public GitHub runners.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache target directory
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-target-clippy-${{ hashFiles('**/Cargo.lock') }}
      - name: Run clippy
        run: cargo +nightly clippy --workspace --all-targets -- -D warnings

  # Run tests
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache target directory
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.rust }}-target-test-${{ hashFiles('**/Cargo.lock') }}
      - name: Run tests
        run: cargo test --workspace
      - name: Run doc tests
        run: cargo test --workspace --doc

  # Detect version changes and prepare for release
  version-check:
    name: Check Version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      version_changed: ${{ steps.version.outputs.changed }}
      new_version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get current version from Cargo.toml
        id: cargo_version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current Cargo.toml version: $VERSION"
      - name: Get latest git tag
        id: latest_tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0)
          LATEST_VERSION=${LATEST_TAG#v}
          echo "version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest git tag version: $LATEST_VERSION"
      - name: Compare versions
        id: version
        run: |
          CARGO_VERSION="${{ steps.cargo_version.outputs.version }}"
          TAG_VERSION="${{ steps.latest_tag.outputs.version }}"

          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"
            echo "✅ Version changed: $TAG_VERSION -> $CARGO_VERSION"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  Version unchanged: $CARGO_VERSION"
          fi

  # Release: Tag, Changelog, GitHub Release, and Publish
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, version-check]
    if: needs.version-check.outputs.version_changed == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure Release Tag Exists
        run: |
          VERSION="${{ needs.version-check.outputs.new_version }}"
          TAG="$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git tag -a "$TAG" -m "Release $TAG"
            echo "Created tag $TAG on HEAD."
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish workspace crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          VERSION: ${{ needs.version-check.outputs.new_version }}
        run: |
          version_exists() {
            crate_name="$1"
            if response=$(curl -fsS -A "legra-ai-release-workflow" \
              "https://crates.io/api/v1/crates/$crate_name"); then
              :
            else
              response_rc=$?
              return "$response_rc"
            fi
            printf '%s' "$response" | jq -e --arg version "$VERSION" \
              '.versions | any(.num == $version)' >/dev/null
          }

          publish_crate() {
            manifest="$1"
            crate_name="$2"

            if version_exists "$crate_name"; then
              echo "$crate_name $VERSION is already published"
              return 0
            else
              exists_rc=$?
              if [ "$exists_rc" -ne 1 ]; then
                return "$exists_rc"
              fi
            fi

            if ! cargo publish --manifest-path "$manifest"; then
              return 1
            fi

            attempt=1
            while [ "$attempt" -le 30 ]; do
              if version_exists "$crate_name"; then
                return 0
              else
                exists_rc=$?
                if [ "$exists_rc" -ne 1 ]; then
                  return "$exists_rc"
                fi
              fi
              sleep 10
              attempt=$((attempt + 1))
            done
            echo "$crate_name $VERSION did not become visible on crates.io" >&2
            return 1
          }

          publish_crate crate/ekg-error/Cargo.toml ekg-error || exit $?
          publish_crate crate/ekg-util/Cargo.toml ekg-util || exit $?
          publish_crate crate/ekg-identifier/Cargo.toml ekg-identifier || exit $?
          publish_crate crate/ekg-metadata/Cargo.toml ekg-metadata || exit $?
          publish_crate crate/ekg-sparql/Cargo.toml ekg-sparql || exit $?

      - name: Push Release Tag
        run: |
          VERSION="${{ needs.version-check.outputs.new_version }}"
          git push origin "$VERSION"
          echo "✅ Pushed tag $VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version-check.outputs.new_version }}
          name: ${{ needs.version-check.outputs.new_version }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "🎉 Successfully released ${{ needs.version-check.outputs.new_version }}"
          echo "📝 GitHub Release: https://github.com/${{ github.repository }}/releases/tag/${{ needs.version-check.outputs.new_version }}"
